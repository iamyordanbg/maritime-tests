<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      /* M — голяма, заема всичко */
      .m{font:bold 30px Georgia,serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
      /* Фар — скрит по подразбиране */
      .lh{opacity:0}
      /* Анимация на М — цикъл 71s (1s fade out + 10s фар + 60s пауза) */
      .m{animation:mAnim 71s infinite}
      @keyframes mAnim{
        0%,1.4%{font-size:30px;transform:translateY(0)}        /* стоим голямо */
        2.8%{font-size:22px;transform:translateY(4px)}         /* смаляване */
        14.1%,14.1%{font-size:22px;transform:translateY(4px)}  /* фарът свети */
        15.5%{font-size:30px;transform:translateY(0)}          /* обратно голямо */
        100%{font-size:30px;transform:translateY(0)}
      }
      /* Фар появяване */
      .lh{animation:lhAnim 71s infinite}
      @keyframes lhAnim{
        0%,1.4%{opacity:0}
        2.8%{opacity:1}
        14.1%{opacity:1}
        15.5%,100%{opacity:0}
      }
      /* Светлини въртене */
      .rays{animation:rayRot 2s linear infinite,lhAnim 71s infinite}
      @keyframes rayRot{to{transform:rotate(360deg)}}
    </style>
  </defs>

  <!-- Фон -->
  <rect width="32" height="32" rx="5" fill="#0B132B"/>

  <!-- Буква М -->
  <text x="16" y="17" class="m">M</text>

  <!-- Фар (центриран горе, малък) -->
  <g class="lh" transform="translate(16,8)">
    <!-- Тяло на фара -->
    <rect x="-2" y="0" width="4" height="7" fill="#cdd6e8" rx="0.5"/>
    <rect x="-3" y="6" width="6" height="1.5" fill="#aab4cc" rx="0.3"/>
    <!-- Купол -->
    <ellipse cx="0" cy="0" rx="2.5" ry="1.2" fill="#7a8faa"/>
    <!-- Светлини -->
    <g class="rays" style="transform-origin:0px 3px">
      <line x1="0" y1="3" x2="-9" y2="0" stroke="rgba(255,255,200,0.7)" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="0" y1="3" x2="9" y2="0" stroke="rgba(255,255,200,0.7)" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="0" y1="3" x2="-8" y2="-3" stroke="rgba(255,255,200,0.4)" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="0" y1="3" x2="8" y2="-3" stroke="rgba(255,255,200,0.4)" stroke-width="0.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>

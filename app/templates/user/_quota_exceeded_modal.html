<!-- QUOTA EXCEEDED MODAL -->
<div id="quotaExceededModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-[100]">
    <div class="bg-[#1C2541] border border-slate-700/60 w-[440px] max-w-[92vw] rounded-xl p-6 shadow-2xl text-center space-y-4">
        <div class="w-12 h-12 rounded-full bg-red-500/15 flex items-center justify-center mx-auto">
            <i class="fa-solid fa-triangle-exclamation text-red-400 text-xl"></i>
        </div>
        <h5 class="text-sm font-bold text-white">Question Limit Reached</h5>
        <p class="text-[12.5px] text-slate-300 leading-relaxed">You have reached the question-solving limit for this plan. If you want to continue preparing, please activate a new subscription!</p>
        <div class="flex justify-center gap-2 pt-1">
            <button onclick="document.getElementById('quotaExceededModal').classList.add('hidden')"
                class="bg-[#3A506B]/30 hover:bg-[#3A506B]/50 text-slate-300 font-bold py-2 px-4 rounded transition uppercase tracking-wider text-[11px]">Close</button>
            <button onclick="document.getElementById('quotaExceededModal').classList.add('hidden');openPlansModal()"
                class="bg-amber-500 hover:bg-amber-400 text-[#0B132B] font-bold py-2 px-4 rounded transition uppercase tracking-wider text-[11px]">View Plans</button>
        </div>
    </div>
</div>

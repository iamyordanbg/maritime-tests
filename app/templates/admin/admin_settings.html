{% extends 'layouts/base.html' %}
{% block title %}Настройки | Морски Тестове{% endblock %}
{% block body %}
<div class="h-screen flex overflow-hidden">
    {% set active = 'settings' %}
    {% include 'layouts/admin_sidebar.html' %}

    <div class="flex-1 flex flex-col overflow-hidden bg-[#0B132B]">
        <header class="flex items-center justify-between border-b border-slate-700/30 shrink-0 px-6 bg-[#0B132B]" style="height:56px">
            <h2 class="text-white font-semibold text-sm">Настройки</h2>
        </header>
        <div class="flex-1 overflow-y-auto p-6">
            <div class="max-w-lg">
                <div class="bg-[#1C2541] rounded-2xl border border-slate-700/40 p-6">
                    <h3 class="text-white font-semibold text-sm mb-4">Акаунт</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="text-xs text-slate-400 block mb-1">Имейл</label>
                            <p class="text-white text-sm">{{ admin_user.email if admin_user else 'admin' }}</p>
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 block mb-1">Роля</label>
                            <p class="text-purple-300 text-sm">Администратор</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

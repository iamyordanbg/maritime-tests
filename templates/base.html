<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Морски Тестове{% endblock %}</title>
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <script>
    // Load Tailwind from multiple CDN sources with fallback
    (function() {
        var cdns = [
            'https://cdn.tailwindcss.com/3.4.17',
            'https://unpkg.com/tailwindcss@3.4.17/src/index.js',
        ];
        function loadScript(src, fallback) {
            var s = document.createElement('script');
            s.src = src;
            s.onerror = fallback || function(){};
            document.head.appendChild(s);
        }
        var s = document.createElement('script');
        s.src = cdns[0];
        s.onerror = function() { loadScript(cdns[1]); };
        document.head.appendChild(s);
    })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin onerror="console.warn('Font Awesome failed to load')">
    {% block head %}{% endblock %}
</head>
<body class="bg-[#0B132B] text-slate-200 font-sans antialiased">
    {% block body %}{% endblock %}

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div id="flash-container" class="fixed bottom-6 right-6 z-[100] space-y-2">
        {% for category, message in messages %}
        <div class="px-4 py-3 rounded-xl text-[11px] font-bold shadow-2xl border
            {% if category == 'error' %}bg-rose-500/20 border-rose-500/40 text-rose-300
            {% else %}bg-emerald-500/20 border-emerald-500/40 text-emerald-300{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    <script>setTimeout(() => { const el = document.getElementById('flash-container'); if(el) el.remove(); }, 4000);</script>
    {% endif %}
    {% endwith %}
<script>
// Анти-sleep ping - не позволява на Railway да заспи
setInterval(() => fetch('/ping').catch(()=>{}), 4 * 60 * 1000);
</script>
<style>
/* Ръчичка на всички кликаеми елементи */
a, button, [onclick], label[for], input[type="radio"], input[type="checkbox"], 
input[type="submit"], input[type="button"], select, .cursor-pointer,
img[onclick] {
    cursor: pointer !important;
}
</style>
</body>
</html>

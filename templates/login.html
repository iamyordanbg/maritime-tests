{% extends 'base.html' %}
{% block title %}Вход | Морски Тестове<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-[#0B132B]">
    <div class="w-[380px] space-y-6">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-[#06D6A0]/10 rounded-2xl flex items-center justify-center border border-[#06D6A0]/20 mx-auto">
                <i class="fa-solid fa-anchor text-xl text-[#06D6A0]"></i>
            </div>
            <h1 class="text-xl font-black text-white">Морски Тестове</h1>
            <p class="text-slate-400 text-xs">Платформа за изпитна подготовка</p>
        </div>

        <div class="bg-[#1C2541] border border-slate-700/50 rounded-2xl p-6 shadow-2xl space-y-4">
            <h2 class="text-sm font-bold text-white">Вход в системата</h2>
            
        <!-- Google Login -->
        <a href="/auth/google"
           style="display:flex;align-items:center;justify-content:center;gap:10px;
                  width:100%;padding:11px;border-radius:10px;margin-bottom:16px;
                  background:#fff;color:#1f2937;font-size:14px;font-weight:500;
                  text-decoration:none;border:1px solid #e5e7eb;transition:all 0.2s"
           onmouseover="this.style.background='#f9fafb';this.style.boxShadow='0 2px 8px rgba(0,0,0,0.1)'"
           onmouseout="this.style.background='#fff';this.style.boxShadow='none'">
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Вход с Google
        </a>

        <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
          <div style="flex:1;height:1px;background:rgba(255,255,255,0.1)"></div>
          <span style="font-size:11px;color:rgba(255,255,255,0.35)">или с имейл</span>
          <div style="flex:1;height:1px;background:rgba(255,255,255,0.1)"></div>
        </div>
<form method="POST" class="space-y-3">
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1 uppercase tracking-wider">Имейл</label>
                    <input type="email" name="email" required placeholder="вашия@имейл.com"
                        class="w-full bg-[#0B132B] border border-slate-700/60 rounded-lg p-2.5 text-[11px] text-white focus:outline-none focus:border-[#06D6A0] transition">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1 uppercase tracking-wider">Парола</label>
                    <input type="password" name="password" required placeholder="••••••••"
                        class="w-full bg-[#0B132B] border border-slate-700/60 rounded-lg p-2.5 text-[11px] text-white focus:outline-none focus:border-[#06D6A0] transition">
                </div>
                <div class="cf-turnstile mb-3" 
                     data-sitekey="{{ recaptcha_site_key }}"
                     data-theme="dark">
                </div>
                <button type="submit" class="w-full bg-[#06D6A0] hover:bg-[#05b88a] text-[#0B132B] font-black py-2.5 rounded-lg text-[11px] uppercase tracking-wider transition shadow-md mt-2">
                    Влез в системата
                </button>
            </form>
            <p class="text-center text-[10px] text-slate-500">
                Нямаш акаунт?
                <a href="{{ url_for('register') }}" class="text-[#06D6A0] hover:underline font-medium">Регистрирай се с промокод</a>
            </p>
        </div>
    </div>
</div>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{% endblock %}

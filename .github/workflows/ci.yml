name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (unit + integration)
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Jinja template syntax check
        run: |
          python -c "
          import os
          os.environ.setdefault('DATABASE_URL', 'sqlite:///:memory:')
          from app import create_app
          app = create_app()
          errors = []
          with app.app_context():
              for root, dirs, files in os.walk('app/templates'):
                  for fname in files:
                      if fname.endswith('.html'):
                          rel = os.path.relpath(os.path.join(root, fname), 'app/templates')
                          try:
                              src = app.jinja_env.loader.get_source(app.jinja_env, rel)[0]
                              app.jinja_env.parse(src)
                          except Exception as e:
                              errors.append(f'{rel}: {e}')
              if errors:
                  print('Jinja syntax errors found:')
                  for e in errors:
                      print(' -', e)
                  raise SystemExit(1)
              print('All Jinja templates parsed successfully.')
          "

      - name: JavaScript syntax check
        run: |
          for f in app/static/js/*.js; do
            node --check "$f" || exit 1
          done
          echo "All JS files passed syntax check."
